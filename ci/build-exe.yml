name: Build Windows EXE

on:
  push:
    branches:
      - arena/01a010af-c-class
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore DentalCenter.csproj -r win-x64

      - name: Publish single-file exe
        run: >
          dotnet publish DentalCenter.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableWindowsTargeting=true
          -o publish

      - name: List output
        shell: pwsh
        run: Get-ChildItem publish | Format-Table Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DentalCenter-win-x64
          path: publish/**
          if-no-files-found: error
